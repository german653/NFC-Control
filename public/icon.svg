<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean Black Background with soft squircle -->
  <rect width="512" height="512" rx="128" fill="#18181b"/>
  <!-- Inner White Card Border -->
  <rect x="80" y="80" width="352" height="352" rx="48" fill="#27272a" stroke="#ffffff" stroke-width="14"/>
  
  <!-- Up Arrow / Sales (+) in white -->
  <g transform="translate(140, 160)">
    <path d="M 40 80 L 40 10 M 15 35 L 40 10 L 65 35" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="30" y="115" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  </g>

  <!-- Down Arrow / Purchases (-) in white -->
  <g transform="translate(290, 160)">
    <path d="M 40 10 L 40 80 M 15 55 L 40 80 L 65 55" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="40" y="115" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="320" x2="392" y2="320" stroke="#52525b" stroke-width="8" stroke-linecap="round"/>

  <!-- Subtitle Text -->
  <text x="256" y="375" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">VENTAS &amp; COMPRAS</text>
</svg>
